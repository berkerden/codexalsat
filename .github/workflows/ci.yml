name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/secret_scan.py --all

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotlab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/spotlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check backend/src backend/tests scripts/macos_service.py scripts/service_supervisor.py
      - run: python -m mypy backend/src scripts/macos_service.py scripts/service_supervisor.py
      - run: python -m pytest
      - run: python -m build --wheel
      - run: python -m pip_audit

  postgres-recovery:
    name: PostgreSQL recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotlab_recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - name: Restore synthetic ledgers into isolated empty databases
        env:
          SPOTLAB_REQUIRE_POSTGRES_RECOVERY: "1"
          TEST_POSTGRES_RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest backend/tests/test_postgres_recovery.py -o addopts='' -v

  postgres-pitr:
    name: PostgreSQL point-in-time recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - run: docker pull postgres:16-alpine
      - name: Recover synthetic ledgers to a selected time
        env:
          SPOTLAB_REQUIRE_POSTGRES_PITR: "1"
        run: python -m pytest backend/tests/test_postgres_pitr.py -o addopts='' -v

  compose-integration:
    name: Clean Compose application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build clean source and verify persisted application through browser
        env:
          SPOTLAB_REQUIRE_COMPOSE: "1"
          SPOTLAB_COMPOSE_BROWSER_NODE: node
        run: python -m pytest backend/tests/test_compose_integration.py -o addopts='' -v

  backup-transfer-source:
    name: Synthetic backup transfer source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotlab_recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - name: Create only synthetic transfer files
        id: bundle
        env:
          SPOTLAB_REQUIRE_BACKUP_TRANSFER: "1"
          SPOTLAB_TRANSFER_PHASE: source
          TEST_POSTGRES_RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest backend/tests/test_backup_transfer.py -o addopts='' -v
      - name: Transfer allowlisted synthetic files only
        uses: actions/upload-artifact@v4
        with:
          name: spotlab-synthetic-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/spotlab-synthetic-transfer/paper.pgcustom
            ${{ runner.temp }}/spotlab-synthetic-transfer/testnet.sqlite
            ${{ runner.temp }}/spotlab-synthetic-transfer/expected.json
            ${{ runner.temp }}/spotlab-synthetic-transfer/manifest.json

  backup-transfer-restore:
    name: Restore transferred synthetic backup
    needs: backup-transfer-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotlab_recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: spotlab-synthetic-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spotlab-synthetic-transfer
      - name: Verify transfer before restoring into fresh targets
        env:
          SPOTLAB_REQUIRE_BACKUP_TRANSFER: "1"
          SPOTLAB_TRANSFER_PHASE: restore
          SPOTLAB_TRANSFER_MANIFEST_SHA256: ${{ needs.backup-transfer-source.outputs.manifest_sha256 }}
          TEST_POSTGRES_RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest backend/tests/test_backup_transfer.py -o addopts='' -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
